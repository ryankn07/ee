name: Prepare original Canva card assets

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: canva-card-import
  cancel-in-progress: false

jobs:
  import-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image decoder
        run: python -m pip install --no-input Pillow

      - name: Import original Canva pages
        run: python scripts/import_canva_cards.py

      - name: Create an isolated review branch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add ui/cards
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No card asset changes were produced."
            exit 0
          fi
          branch="automation/canva-card-import-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(assets): refresh original Canva cards"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open a pull request for review
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.changes.outputs.branch }}
        run: |
          gh pr create             --base main             --head "$HEAD_BRANCH"             --title "chore(assets): refresh original Canva cards"             --body "## Summary
          - Imports the original card artwork from the checked-in Canva manifest.
          - Keeps generated asset changes isolated for maintainer review.

          ## Verification
          - Review the image diff and confirm that the original artwork is intact.
          - Run the repository CI checks before merging."
